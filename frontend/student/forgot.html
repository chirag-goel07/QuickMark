<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickMark - Forgot password</title>
<link rel="stylesheet" href="/css/student.css">
</head>
<body data-role="student">
<div class="login-wrap"><div class="login-card">
  <h1>⚡ QuickMark</h1><p class="subtle">Forgot password</p>
  <div id="error" class="error-msg"></div>
  <div id="noEmail" class="warn" style="display:none"></div>
  <div id="step1">
    <div class="field"><label for="email">Your email</label><input type="email" id="email" autocomplete="username"></div>
    <button id="sendBtn" class="btn full">Send code</button>
    <p class="subtle" style="margin-top:12px"><a href="#" id="haveCode">I already have a code</a> · <a href="/student/login.html">Back to login</a></p>
  </div>
  <div id="step2" style="display:none">
    <p class="subtle" id="sentMsg"></p>
    <div class="field"><label for="code">6-digit code</label><input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
    <div class="field"><label for="new1">New password</label><input type="password" id="new1" autocomplete="new-password"><div class="hint">At least 6 characters.</div></div>
    <div class="field"><label for="new2">Repeat new password</label><input type="password" id="new2" autocomplete="new-password"></div>
    <button id="resetBtn" class="btn full">Set new password</button>
  </div>
  <div id="done" style="display:none"><p>✅ Your password was changed.</p><a class="btn full a-btn" style="text-decoration:none;display:block;text-align:center" href="/student/login.html">Go to login</a></div>
</div></div>
<script src="/js/api.js"></script>
<script src="/js/forgot.js"></script>
</body>
</html>
